<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>VoiceChat - LouisOff84</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #121212; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; text-align: center; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .status { color: #888; margin: 15px 0; font-size: 0.9em; }
        .btn { background: #4f46e5; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="name">Joueur</h2>
    <div id="status" class="status">En attente d'activation...</div>
    <button id="startBtn" class="btn">ACTIVER LE MICRO</button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('user') || "Inconnu";
    document.getElementById('name').innerText = username;

    const status = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    
    // On crée un ID PeerJS basé sur le pseudo
    const peer = new Peer('lous-mc-' + username.toLowerCase());

    let myStream;

    startBtn.onclick = async () => {
        try {
            // Activation Micro
            myStream = await navigator.mediaDevices.getUserMedia({audio: true});
            startBtn.disabled = true;
            startBtn.innerText = "MICRO ACTIF";
            status.innerText = "Recherche d'autres joueurs...";

            // Écouter les appels des autres
            peer.on('call', (call) => {
                console.log("Appel reçu de " + call.peer);
                call.answer(myStream);
                setupAudio(call);
            });

            // FONCTION DE SCAN (Simule un backend)
            // Comme on n'a pas de serveur, on essaie d'appeler les gens manuellement pour le test
            // Dans un vrai projet, il faudrait une liste (Firebase)
            status.innerText = "Connecté. Demande à un ami de se connecter aussi !";

        } catch (err) {
            status.innerText = "Erreur : Autorise le micro !";
            console.error(err);
        }
    };

    function setupAudio(call) {
        call.on('stream', (remoteStream) => {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
            status.innerText = "En discussion avec un autre joueur";
        });
    }

    // Gestion des erreurs PeerJS (si l'ID est déjà pris)
    peer.on('error', (err) => {
        if(err.type === 'unavailable-id') {
            status.innerText = "Erreur: Tu es déjà connecté sur un autre onglet.";
        }
    });
</script>
</body>
</html>
