<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>VoiceChat - LouisOff84</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        body { background: #0f0f0f; color: #e0e0e0; font-family: sans-serif; text-align: center; padding-top: 100px; }
        .card { background: #1a1a1a; padding: 40px; border-radius: 20px; display: inline-block; border: 1px solid #333; }
        .btn-mic { background: #007bff; color: white; border: none; padding: 15px 30px; border-radius: 50px; font-size: 1.2em; cursor: pointer; }
        .pulse { animation: pulse-red 2s infinite; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 0, 0, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 0, 0, 0); } }
    </style>
</head>
<body>

<div class="card">
    <h2 id="name-tag">Chargement...</h2>
    <p id="status">Clique sur le bouton pour rejoindre le chat vocal du serveur.</p>
    <button id="start" class="btn-mic">ACTIVER MON MICRO</button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('user') || "Inconnu";
    document.getElementById('name-tag').innerText = username;

    let myStream;
    const peer = new Peer('mc-voice-' + username); // Ton ID est ton pseudo

    document.getElementById('start').onclick = async () => {
        try {
            // 1. Capture du micro
            myStream = await navigator.mediaDevices.getUserMedia({audio: true});
            document.getElementById('status').innerText = "🎤 Micro activé - Recherche de joueurs...";
            document.getElementById('start').style.display = "none";

            // 2. Gestion des appels reçus
            peer.on('call', (call) => {
                call.answer(myStream);
                handleCall(call);
            });

            // 3. Système d'auto-connexion (Exemple avec un second joueur)
            // Note: Sans backend, tu dois savoir qui appeler. 
            // On peut tester en essayant d'appeler les joueurs communs.
            const playersToTry = ["joueur1", "joueur2", "louisoff84"]; 
            playersToTry.forEach(p => {
                if(p !== username.toLowerCase()) {
                    const call = peer.call('mc-voice-' + p, myStream);
                    if(call) handleCall(call);
                }
            });

        } catch (e) {
            alert("Erreur micro : " + e);
        }
    };

    function handleCall(call) {
        call.on('stream', (remoteStream) => {
            const audio = new Audio();
            audio.srcObject = remoteStream;
            audio.play();
        });
    }
</script>
</body>
</html>
